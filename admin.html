<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Админка · Тігіс</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#8c4519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тігіс">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Yeseva+One&display=swap">
<link rel="stylesheet" href="admin.css">
<style>
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin-inline: -16px; padding-inline: 16px; background: var(--bg); border-bottom: 1px dashed var(--line);
}
.top .in { max-width: 1180px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 12px; flex-wrap: wrap; }
.top .who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.page { max-width: 1180px; margin-inline: auto; padding-block: 28px 60px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: start; }
.page > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 16px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.panel-head h2 { font-size: 1.5rem; }

.list { display: grid; gap: 10px; }
.item {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center;
  padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
}
.item.editing { border-color: var(--cognac); box-shadow: 0 0 0 1px var(--cognac); }
.item.hidden-item { opacity: .6; }
.thumb { width: 76px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--cognac-soft); display: grid; place-items: center; color: var(--muted); font-size: .7rem; text-align: center; }
.item .meta { min-width: 0; }
.item .meta b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta span { font-size: .85rem; color: var(--muted); }
.item .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.badge { font-family: var(--font-mono); font-size: .7rem; padding: 2px 8px; border-radius: 999px; border: 1px dashed var(--muted); color: var(--muted); margin-left: 6px; }
.empty { text-align: center; padding: 28px 12px; border: 1.5px dashed var(--line); border-radius: 12px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

.editor { position: sticky; top: 80px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.drop {
  position: relative; display: grid; place-items: center; gap: 6px; min-height: 180px; border: 1.5px dashed var(--line);
  border-radius: 12px; background: var(--bg); cursor: pointer; overflow: hidden; text-align: center; padding: 12px; color: var(--muted);
}
.drop:hover, .drop.over { border-color: var(--cognac); color: var(--ink); }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop .hint { position: relative; font-size: .9rem; }
.photo-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.form-acts { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px; border-top: 1px dashed var(--line); }
.form-acts .btn-primary { flex: 1; }

.gate { max-width: 460px; margin: 80px auto; text-align: center; display: grid; gap: 14px; justify-items: center; color: var(--muted); }
.back-btn { display: none; }
.fab { display: none; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick label { position: relative; overflow: hidden; }
.pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* Телефон и планшет: список, редактор открывается на весь экран */
@media (max-width: 900px) {
  .page { grid-template-columns: 1fr; padding-block: 16px 110px; }
  .field input, .field select, .field textarea { font-size: 16px; padding: .8em .9em; }
  .editor {
    display: none; position: fixed; inset: 0; z-index: 30; top: 0;
    border-radius: 0; border: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 96px);
    background: var(--bg);
  }
  body.editor-open .editor { display: grid; align-content: start; }
  body.editor-open { overflow: hidden; }
  .editor .panel-head { position: sticky; top: calc(-12px - env(safe-area-inset-top, 0px)); z-index: 2; background: var(--bg); margin-inline: -16px; padding: 10px 16px; border-bottom: 1px dashed var(--line); justify-content: start; flex-wrap: nowrap; }
  .editor .panel-head h2 { font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .back-btn { display: inline-flex; flex: none; }
  .form-acts {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface);
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--line);
  }
  .form-acts .btn { min-height: 50px; }
  .drop { min-height: 220px; }
  .fab {
    display: inline-flex; position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 20;
    min-height: 56px; padding-inline: 22px; box-shadow: 0 10px 24px -10px var(--cognac); font-size: 1.05rem;
  }
  #new-btn { display: none; }
  .item { cursor: pointer; }
  .item .acts .btn { min-height: 40px; }
}
@media (max-width: 520px) {
  .row2, .row3 { grid-template-columns: 1fr 1fr; }
  .row3 .field:last-child { grid-column: 1 / -1; }
  .item { grid-template-columns: 64px 1fr; }
  .thumb { width: 64px; height: 56px; }
  .item .acts { grid-column: 1 / -1; justify-content: stretch; }
  .item .acts .btn { flex: 1; }
  .panel { padding: 14px; }
  .top .who #who { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a class="logo" href="./">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="var(--cognac)"/>
        <circle cx="20" cy="20" r="14" fill="none" stroke="var(--on-accent)" stroke-width="1.4" stroke-dasharray="3 2.4"/>
        <path d="M13 14 H27 M20 14 V28" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <b>Тігіс · админка</b>
    </a>
    <div class="who">
      <span id="who"></span>
      <a class="btn btn-ghost btn-sm" href="./" target="_blank" rel="noopener">Открыть сайт</a>
      <button class="btn btn-ghost btn-sm" type="button" id="logout" hidden>Выйти</button>
    </div>
  </div>
</header>

<div class="gate" id="gate">
  <p id="gate-text">Проверяем вход…</p>
</div>

<main class="page" id="app" hidden>
  <section class="panel">
    <div class="panel-head">
      <h2>Сумки на сайте</h2>
      <button class="btn btn-primary btn-sm" type="button" id="new-btn">+ Новая сумка</button>
    </div>
    <p class="msg" id="list-msg" role="status" hidden></p>
    <div class="list" id="list"></div>
  </section>

  <section class="panel editor">
    <div class="panel-head">
      <button class="btn btn-ghost btn-sm back-btn" type="button" id="back-btn" aria-label="Назад к списку">←</button>
      <h2 id="editor-title">Новая сумка</h2>
    </div>
    <form id="bag-form" novalidate>
      <div style="display:grid; gap:14px">
        <div class="field">
          <label>Фото</label>
          <label class="drop" id="drop">
            <img id="preview" alt="" hidden>
            <span class="hint" id="drop-hint">Нажмите, чтобы выбрать фото,<br>или перетащите его сюда</span>
            <input type="file" id="photo" accept="image/*">
          </label>
          <div class="pick">
            <label class="btn btn-ghost btn-sm">Сфотографировать<input type="file" id="photo-camera" accept="image/*" capture="environment"></label>
            <label class="btn btn-ghost btn-sm">Из галереи<input type="file" id="photo-gallery" accept="image/*"></label>
          </div>
          <div class="photo-acts">
            <button class="btn btn-ghost btn-sm" type="button" id="photo-clear" hidden>Убрать фото</button>
          </div>
        </div>

        <div class="field">
          <label for="name">Название</label>
          <input id="name" type="text" placeholder="Тоут «Базар»" required>
        </div>
        <div class="field">
          <label for="description">Описание</label>
          <textarea id="description" placeholder="Для чего сумка, что внутри, чем особенная"></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label for="price">Цена, ₸</label>
            <input id="price" type="number" min="0" step="500" inputmode="numeric" placeholder="68000" required>
          </div>
          <div class="field">
            <label for="size">Размер</label>
            <input id="size" type="text" placeholder="38 × 32 × 12 см">
          </div>
        </div>
        <div class="row3">
          <div class="field">
            <label for="leather">Кожа</label>
            <input id="leather" type="text" placeholder="2,2 мм">
          </div>
          <div class="field">
            <label for="hours">Часов работы</label>
            <input id="hours" type="number" min="0" inputmode="numeric" placeholder="14">
          </div>
          <div class="field">
            <label for="sort">Порядок</label>
            <input id="sort" type="number" inputmode="numeric" placeholder="1">
          </div>
        </div>
        <div class="field">
          <label for="shape">Рисунок, если нет фото</label>
          <select id="shape">
            <option value="tote">Тоут</option>
            <option value="crossbody">Кросс-боди</option>
            <option value="clutch">Клатч</option>
            <option value="sack">Мешок</option>
            <option value="backpack">Рюкзак</option>
            <option value="belt">Поясная</option>
          </select>
        </div>
        <label class="check"><input type="checkbox" id="visible" checked> Показывать на сайте</label>

        <p class="msg" id="form-msg" role="status" hidden></p>

        <div class="form-acts">
          <button class="btn btn-primary" type="submit" id="save-btn">Сохранить</button>
          <button class="btn btn-ghost" type="button" id="cancel-btn" hidden>Отмена</button>
        </div>
      </div>
    </form>
  </section>
</main>

<button class="btn btn-primary fab" type="button" id="fab" hidden>+ Новая сумка</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const cfg = window.TIGIS_CONFIG || {};
const BUCKET = "bag-photos";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const fmt = n => String(n ?? 0).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₸";

// Примерные модели — можно загрузить одной кнопкой, пока база пустая
const SAMPLE = [
  { name: "Тоут «Базар»", shape: "tote", description: "Вместительная сумка на плечо для города и рынка. Внутри карман для телефона и ключей.", size: "38 × 32 × 12 см", leather: "2,2 мм", hours: 14, price: 68000 },
  { name: "Кросс-боди «Жол»", shape: "crossbody", description: "Небольшая сумка через плечо с клапаном и регулируемым ремнём.", size: "22 × 16 × 6 см", leather: "1,8 мм", hours: 8, price: 42000 },
  { name: "Клатч «Ою»", shape: "clutch", description: "Клатч из кожи со вставкой из войлока, на которой вышит орнамент ою.", size: "26 × 15 × 2 см", leather: "1,8 мм + войлок", hours: 10, price: 36000 },
  { name: "Мешок «Қап»", shape: "sack", description: "Мягкая сумка-мешок на кожаном шнурке. Затягивается одним движением.", size: "28 × 30 × 18 см", leather: "1,6 мм", hours: 9, price: 49000 },
  { name: "Рюкзак «Сапар»", shape: "backpack", description: "Городской рюкзак с клапаном и внешним карманом. Помещается ноутбук 13″.", size: "30 × 40 × 14 см", leather: "2,2 мм", hours: 14, price: 79000 },
  { name: "Поясная «Кіші»", shape: "belt", description: "Компактная сумка на пояс или через грудь для самого нужного.", size: "20 × 12 × 5 см", leather: "1,8 мм", hours: 6, price: 28000 }
];

let db, bags = [], editingId = null, photoFile = null, photoUrl = null;

function showMsg(el, text, kind) { el.textContent = text; el.className = "msg " + kind; el.hidden = !text; }

if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) {
  $("gate-text").textContent = "Админка пока не подключена: не заполнены настройки хранилища в config.js.";
} else {
  db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  db.auth.getSession().then(({ data }) => {
    if (data.session) start(data.session);
    else setTimeout(async () => {
      // Даём время обработать ссылку из письма
      const again = await db.auth.getSession();
      if (again.data.session) start(again.data.session);
      else location.replace("login.html");
    }, 800);
  });
  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") location.replace("login.html");
    if (event === "SIGNED_IN" && session && $("app").hidden) start(session);
  });
}

let started = false;
function start(session) {
  if (started) return;
  started = true;
  if (location.hash.includes("access_token")) history.replaceState(null, "", location.pathname);
  $("who").textContent = session.user.email;
  $("logout").hidden = false;
  $("gate").hidden = true;
  $("app").hidden = false;
  $("fab").hidden = false;
  loadBags();
}

const isMobile = () => window.matchMedia("(max-width: 900px)").matches;

$("logout").addEventListener("click", () => db.auth.signOut());

async function loadBags() {
  const { data, error } = await db.from("bags").select("*").order("sort", { ascending: true }).order("created_at", { ascending: true });
  if (error) { showMsg($("list-msg"), "Не удалось загрузить список: " + error.message, "err"); return; }
  bags = data;
  renderList();
}

function renderList() {
  const list = $("list");
  if (!bags.length) {
    list.innerHTML = `<div class="empty">
      <p>Сумок пока нет. На сайте показываются примерные модели.</p>
      <button class="btn btn-ghost btn-sm" type="button" id="seed-btn">Загрузить 6 примерных моделей для правки</button>
    </div>`;
    $("seed-btn").addEventListener("click", seed);
    return;
  }
  list.innerHTML = bags.map(b => `
    <div class="item${b.id === editingId ? " editing" : ""}${b.visible ? "" : " hidden-item"}">
      ${b.photo_url ? `<img class="thumb" src="${esc(b.photo_url)}" alt="">` : `<span class="thumb">нет фото</span>`}
      <div class="meta">
        <b>${esc(b.name)}${b.visible ? "" : '<span class="badge">скрыта</span>'}</b>
        <span class="mono">${fmt(b.price)}${b.size ? " · " + esc(b.size) : ""}</span>
      </div>
      <div class="acts">
        <button class="btn btn-ghost btn-sm" type="button" data-edit="${b.id}">Изменить</button>
        <button class="btn btn-ghost btn-sm" type="button" data-toggle="${b.id}">${b.visible ? "Скрыть" : "Показать"}</button>
        <button class="btn btn-danger btn-sm" type="button" data-del="${b.id}">Удалить</button>
      </div>
    </div>`).join("");
}

async function seed() {
  const rows = SAMPLE.map((s, i) => ({ ...s, sort: i + 1, visible: true }));
  const { error } = await db.from("bags").insert(rows);
  if (error) { showMsg($("list-msg"), "Не удалось добавить: " + error.message, "err"); return; }
  showMsg($("list-msg"), "Примерные модели добавлены. Замените фото, описания и цены на свои.", "ok");
  loadBags();
}

// Список: изменить / удалить (удаление — в два нажатия)
let pendingDelete = null;
$("list").addEventListener("click", async e => {
  const edit = e.target.closest("[data-edit]");
  const del = e.target.closest("[data-del]");
  const toggle = e.target.closest("[data-toggle]");
  if (edit) { openEditor(bags.find(b => b.id === edit.dataset.edit)); return; }
  if (toggle) {
    const bag = bags.find(b => b.id === toggle.dataset.toggle);
    toggle.disabled = true;
    const { error } = await db.from("bags").update({ visible: !bag.visible }).eq("id", bag.id);
    if (error) { showMsg($("list-msg"), "Не удалось изменить: " + error.message, "err"); toggle.disabled = false; return; }
    showMsg($("list-msg"), `«${bag.name}» ${bag.visible ? "скрыта с сайта" : "снова на сайте"}.`, "ok");
    loadBags();
    return;
  }
  if (!del) {
    // На телефоне нажатие на карточку открывает редактор
    const item = e.target.closest(".item");
    if (item && isMobile() && !e.target.closest("button")) {
      const btn = item.querySelector("[data-edit]");
      if (btn) openEditor(bags.find(b => b.id === btn.dataset.edit));
    }
    return;
  }
  const id = del.dataset.del;
  if (pendingDelete !== id) {
    pendingDelete = id;
    del.textContent = "Точно удалить?";
    setTimeout(() => { if (pendingDelete === id) { pendingDelete = null; renderList(); } }, 4000);
    return;
  }
  pendingDelete = null;
  const bag = bags.find(b => b.id === id);
  const { error } = await db.from("bags").delete().eq("id", id);
  if (error) { showMsg($("list-msg"), "Не удалось удалить: " + error.message, "err"); return; }
  if (bag && bag.photo_url) removePhoto(bag.photo_url);
  if (editingId === id) resetEditor();
  showMsg($("list-msg"), "Сумка «" + (bag ? bag.name : "") + "» удалена.", "ok");
  loadBags();
});

// Редактор
const fields = ["name", "description", "price", "size", "leather", "hours", "sort", "shape"];

function openEditor(bag) {
  editingId = bag.id;
  fields.forEach(f => { $(f).value = bag[f] ?? ""; });
  if (!bag.shape) $("shape").value = "tote";
  $("visible").checked = bag.visible !== false;
  photoFile = null;
  photoUrl = bag.photo_url || null;
  setPreview(photoUrl);
  $("editor-title").textContent = "Изменить: " + bag.name;
  $("cancel-btn").hidden = false;
  showMsg($("form-msg"), "", "ok");
  renderList();
  showEditor();
}

// Полноэкранный редактор на телефоне; кнопка «Назад» телефона закрывает его
function showEditor() {
  if (!isMobile()) return;
  $("bag-form").closest(".editor").scrollTop = 0;
  if (!document.body.classList.contains("editor-open")) {
    document.body.classList.add("editor-open");
    history.pushState({ editor: true }, "");
  }
}
function closeEditor() {
  document.body.classList.remove("editor-open");
  resetEditor();
}
$("back-btn").addEventListener("click", () => {
  if (history.state && history.state.editor) history.back(); else closeEditor();
});
window.addEventListener("popstate", () => {
  if (document.body.classList.contains("editor-open")) closeEditor();
});

function resetEditor() {
  editingId = null;
  $("bag-form").reset();
  $("visible").checked = true;
  photoFile = null;
  photoUrl = null;
  setPreview(null);
  $("editor-title").textContent = "Новая сумка";
  $("cancel-btn").hidden = true;
  renderList();
}

function openNew() {
  resetEditor();
  showMsg($("form-msg"), "", "ok");
  showEditor();
  if (!isMobile()) $("name").focus();
}
$("new-btn").addEventListener("click", openNew);
$("fab").addEventListener("click", openNew);
$("cancel-btn").addEventListener("click", () => {
  if (document.body.classList.contains("editor-open")) $("back-btn").click();
  else { resetEditor(); showMsg($("form-msg"), "", "ok"); }
});

function setPreview(src) {
  $("preview").hidden = !src;
  if (src) $("preview").src = src; else $("preview").removeAttribute("src");
  $("drop-hint").hidden = !!src;
  $("photo-clear").hidden = !src;
}

["photo", "photo-camera", "photo-gallery"].forEach(id =>
  $(id).addEventListener("change", e => { pickFile(e.target.files[0]); e.target.value = ""; }));
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove("over")));
drop.addEventListener("drop", e => { e.preventDefault(); pickFile(e.dataTransfer.files[0]); });
$("photo-clear").addEventListener("click", () => { photoFile = null; photoUrl = null; $("photo").value = ""; setPreview(null); });

function pickFile(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) { showMsg($("form-msg"), "Это не фото. Выберите файл JPG, PNG или HEIC.", "err"); return; }
  photoFile = file;
  setPreview(URL.createObjectURL(file));
}

// Уменьшаем фото с телефона до 1600 px по длинной стороне, чтобы сайт грузился быстро
function shrink(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const max = 1600;
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), "image/jpeg", 0.85);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

function storagePath(url) {
  const marker = `/object/public/${BUCKET}/`;
  const i = url.indexOf(marker);
  return i === -1 ? null : decodeURIComponent(url.slice(i + marker.length));
}
async function removePhoto(url) {
  const path = storagePath(url);
  if (path) await db.storage.from(BUCKET).remove([path]);
}

$("bag-form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("name").value.trim();
  const price = parseInt($("price").value, 10);
  if (!name) { showMsg($("form-msg"), "Укажите название сумки.", "err"); $("name").focus(); return; }
  if (!(price >= 0)) { showMsg($("form-msg"), "Укажите цену числом, например 68000.", "err"); $("price").focus(); return; }

  const btn = $("save-btn");
  btn.disabled = true;
  btn.textContent = "Сохраняем…";
  try {
    const old = editingId ? bags.find(b => b.id === editingId) : null;
    let url = photoUrl;
    if (photoFile) {
      const blob = await shrink(photoFile);
      const path = `${crypto.randomUUID()}.jpg`;
      const up = await db.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
      if (up.error) throw new Error("фото не загрузилось: " + up.error.message);
      url = db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    }
    const hours = parseInt($("hours").value, 10);
    const sort = parseInt($("sort").value, 10);
    const row = {
      name,
      description: $("description").value.trim(),
      price,
      size: $("size").value.trim(),
      leather: $("leather").value.trim(),
      hours: Number.isFinite(hours) ? hours : null,
      sort: Number.isFinite(sort) ? sort : (bags.length + 1),
      shape: $("shape").value,
      visible: $("visible").checked,
      photo_url: url
    };
    const res = editingId
      ? await db.from("bags").update(row).eq("id", editingId).select().single()
      : await db.from("bags").insert(row).select().single();
    if (res.error) throw new Error(res.error.message);
    if (old && old.photo_url && old.photo_url !== url) removePhoto(old.photo_url);
    const done = `«${res.data.name}» сохранена. На сайте изменения видны после обновления страницы.`;
    await loadBags();
    if (isMobile()) {
      // На телефоне возвращаемся к списку
      if (history.state && history.state.editor) history.back(); else closeEditor();
      showMsg($("list-msg"), done, "ok");
    } else {
      openEditor(res.data);
      showMsg($("form-msg"), done, "ok");
    }
  } catch (err) {
    showMsg($("form-msg"), "Не удалось сохранить: " + err.message, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "Сохранить";
  }
});
</script>
