<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Вход · Тігіс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Yeseva+One&display=swap">
<link rel="stylesheet" href="admin.css">
<style>
body { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; }
.login {
  width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 32px 28px; display: grid; gap: 20px; position: relative;
}
.login::before {
  content: ""; position: absolute; inset: 10px; border: 1.5px dashed var(--line); border-radius: 14px; pointer-events: none;
}
.login > * { position: relative; }
.login h1 { font-size: 1.8rem; }
.login p.sub { color: var(--muted); font-size: .95rem; }
.login form { display: grid; gap: 14px; }
.login .btn { width: 100%; }
.back { text-align: center; font-size: .9rem; }
</style>
</head>
<body>
<main class="login">
  <a class="logo" href="./">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="var(--cognac)"/>
      <circle cx="20" cy="20" r="14" fill="none" stroke="var(--on-accent)" stroke-width="1.4" stroke-dasharray="3 2.4"/>
      <path d="M13 14 H27 M20 14 V28" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <b>Тігіс</b>
  </a>
  <div>
    <h1>Вход для мастера</h1>
    <p class="sub">Введите свою почту. Мы пришлём письмо со ссылкой для входа, пароль не нужен.</p>
  </div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Почта</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
    </div>
    <button class="btn btn-primary" type="submit" id="send-btn">Получить ссылку для входа</button>
  </form>

  <p class="msg" id="msg" role="status" hidden></p>
  <p class="back"><a href="./">← На сайт</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const cfg = window.TIGIS_CONFIG || {};
const form = document.getElementById("login-form");
const emailIn = document.getElementById("email");
const btn = document.getElementById("send-btn");
const msg = document.getElementById("msg");

function show(text, kind) {
  msg.textContent = text;
  msg.className = "msg " + kind;
  msg.hidden = false;
}

if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) {
  show("Вход пока не подключён: не заполнены настройки хранилища в config.js.", "err");
  btn.disabled = true;
} else {
  const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const adminUrl = new URL("admin.html", location.href).href;

  db.auth.getSession().then(({ data }) => { if (data.session) location.replace(adminUrl); });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const email = emailIn.value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) {
      show("Введите почту полностью, например name@gmail.com.", "err");
      emailIn.focus();
      return;
    }
    btn.disabled = true;
    btn.textContent = "Отправляем…";
    const { error } = await db.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: false, emailRedirectTo: adminUrl }
    });
    btn.disabled = false;
    btn.textContent = "Получить ссылку для входа";
    if (error) {
      const denied = /signup|not allowed|not found/i.test(error.message);
      show(denied ? "У этой почты нет доступа к админке." : "Не удалось отправить письмо: " + error.message, "err");
      return;
    }
    show("Письмо отправлено на " + email + ". Откройте его и нажмите ссылку для входа. Если письма нет, проверьте папку «Спам».", "ok");
  });
}
</script>
</body>
</html>
